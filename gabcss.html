<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Css</title>
    
        <style>
        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            background-image: url('https://img.freepik.com/premium-photo/indigo-navy-blue-color-gradient-background-smooth-transition-deep-tones_936686-19634.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            color: #fff;
        }

        nav {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-family: 'Poppins', sans-serif;
            padding: 8px 12px;
        }

        nav a:hover {
            background: #444;
            border-radius: 4px;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Poppins', sans-serif;
            font-size: 50px;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo img {
            max-width: 300px;
            width: 80%;
            border-radius: 10px;
        }

        .info-box {
            background: rgba(75, 0, 130, 0.85);
            color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
        }

        .info-box h2 {
            font-family: 'Poppins', sans-serif;
            margin-top: 0;
            font-size: 28px;
        }

        .info-box p {
            font-size: 18px;
            line-height: 1.7;
        }

        .separator {
            width: 80px;
            height: 2px;
            background-color: #fff;
            margin-top: 10px;
            border-radius: 5px;
        }

        
    </style>
</head>
<body>
    
</body>
</html>
